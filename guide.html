<style>
/* Layout: a friend's field guide — town switcher on top, then winter and summer as two numbered lists of picks, each with room for Kerwin's own story. */
:root{
  color-scheme:light;
  --bg:#FAF7F0; --surface:#FFFFFF; --ink:#14223A; --muted:#5E6675; --line:#E6DFD1;
  --navy:#0D3150; --head:#0D3150; --gold:#C5A273; --gold-ink:#86663B; --tint:#F3EDE1; --red:#B72D39;
  --winter:#2E5A87; --summer:#9A6A1E;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Familjen Grotesk','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1624; --surface:#112033; --ink:#EDE7DC; --muted:#A9B0BC; --line:#253650;
  --navy:#081A2C; --head:#E2CDA8; --gold:#C5A273; --gold-ink:#D9BE90; --tint:#17283E; --red:#E0707A;
  --winter:#8DB6E0; --summer:#E2B66A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1624; --surface:#112033; --ink:#EDE7DC; --muted:#A9B0BC; --line:#253650;
  --navy:#081A2C; --head:#E2CDA8; --gold:#C5A273; --gold-ink:#D9BE90; --tint:#17283E; --red:#E0707A;
  --winter:#8DB6E0; --summer:#E2B66A; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
img{max-width:100%}
[hidden]{display:none!important}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;color:var(--head);margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-weight:600;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-ink)}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.back{display:flex;align-items:center;gap:10px;text-decoration:none}
.back svg{width:36px;height:auto}
.back b{font-family:var(--display);font-weight:700;font-size:18px;color:var(--head);letter-spacing:.5px}
.sym-navy{fill:var(--head)}.sym-gold{fill:var(--gold)}.sym-red{fill:var(--red)}
.ctrls{display:flex;gap:10px;align-items:center}
.seg{display:flex;border:1.5px solid var(--head);border-radius:6px;overflow:hidden}
.seg button,.seg a{background:none;border:0;color:var(--head);font:600 14px var(--body);padding:7px 12px;cursor:pointer;min-height:38px;text-decoration:none;display:flex;align-items:center}
.seg [aria-pressed="true"],.seg [aria-current="page"]{background:var(--head);color:var(--bg)}
/* hero */
header.hero{padding-block:44px 28px;display:flex;flex-direction:column;gap:12px}
header.hero h1{font-size:clamp(38px,6vw,60px)}
header.hero p{max-width:62ch;font-size:18px}
.note{display:block;background:var(--tint);border-radius:8px;padding:14px 16px;font-size:15px;max-width:70ch}
.note b{font-family:var(--display);color:var(--head)}
/* facts */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-block:8px 40px}
@media (max-width:700px){.facts{grid-template-columns:1fr}}
.fact{border-top:2px solid var(--gold);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.fact b{font-family:var(--display);font-size:28px;color:var(--head);line-height:1}
.fact span{font-size:15px}
/* seasons */
section.season{padding-block:12px 36px;display:flex;flex-direction:column;gap:18px}
.season-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.season-head h2{font-size:clamp(28px,4vw,38px)}
.season-head span{font-size:14px;color:var(--muted)}
.picks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:pick}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 14px;counter-increment:pick}
.pick>*{grid-column:2;min-width:0}
.pick::before{content:counter(pick);grid-column:1;grid-row:1/span 7;font-family:var(--display);font-size:30px;font-weight:600;line-height:1;color:var(--gold-ink)}
.winter .pick::before{color:var(--winter)}
.summer .pick::before{color:var(--summer)}
.pick h3{font-size:22px}
.pick .where{font-size:14px;color:var(--muted)}
.pick .tip{font-size:15px;border-left:2px solid var(--gold);padding-left:10px;margin-top:6px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links a{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;text-decoration:none;border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;min-height:36px;color:var(--head);background:var(--bg)}
.links a:hover{border-color:var(--gold)}
.links a svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.eat li a{font-size:14px;color:var(--gold-ink);font-weight:600;text-decoration:none;margin-top:2px}
.eat li a:hover{text-decoration:underline}
.story{margin-top:10px;background:var(--tint);border-radius:8px;padding:12px 14px;font-size:15px}
.story b{font-family:var(--display);color:var(--head);display:block;margin-bottom:4px}
/* eat */
.eat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px;list-style:none;margin:0;padding:0}
@media (max-width:700px){.eat{grid-template-columns:1fr}}
.eat li{border-bottom:1px solid var(--line);padding-block:8px;display:flex;flex-direction:column;min-width:0}
.eat li b{font-family:var(--display);font-size:18px;color:var(--head)}
.eat li span{font-size:15px;color:var(--muted)}
footer{border-top:1px solid var(--line);padding-block:28px 40px;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const UI = {

     note:'<b>Written like a friend would.</b> Kerwin is adding his own stories one by one: the restaurants he loved, the activities that surprised him, and what he would skip.',
     foot:'Hours, seasons and prices change. Check with each place before you go.'},
 es:{winter:'Invierno',summer:'Verano',wsub:'diciembre – marzo',ssub:'junio – septiembre',eat:'Dónde comer',eatsub:'Pronto, las notas de Kerwin',from:'Desde la experiencia de Kerwin',dir:'Cómo llegar',web:'Sitio web',
     note:'<b>Escrito como lo haría un amigo.</b> Kerwin va agregando sus propios relatos poco a poco: los restaurantes que más le gustaron, las actividades que lo sorprendieron y lo que no repetiría.',
     foot:'Horarios, temporadas y precios cambian. Confirma con cada lugar antes de ir.'}
};
let lang='en';
try{ if(localStorage.getItem('mth-lang')==='es') lang='es'; }catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function town(){ const h=location.hash.replace('#',''); return GUIDE[h]?h:'frisco'; }
const gmaps=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const IC_WEB='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>';
const IC_MAP='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
function linksHTML(p){
 const L=[];
 (p.web||[]).forEach(w=>L.push(`<a href="${esc(w[1])}" target="_blank" rel="noopener">${IC_WEB}${esc(w[0][lang]||w[0])}</a>`));
 (p.map||[]).forEach(m=>L.push(`<a href="${gmaps(m[1])}" target="_blank" rel="noopener">${IC_MAP}${esc(m[0][lang]||m[0])}</a>`));
 return L.length?`<div class="links">${L.join('')}</div>`:'';
}
function pickHTML(p){
 const st=p.story&&p.story[lang];
 return `<li class="pick"><h3>${esc(p.t[lang])}</h3><div class="where">${esc(p.w[lang])}</div><p>${esc(p.d[lang])}</p><p class="tip">${esc(p.tip[lang])}</p>${linksHTML(p)}${st?`<div class="story"><b>${UI[lang].from}</b>${esc(st)}</div>`:''}</li>`;
}
function render(){
 const k=town(), g=GUIDE[k], u=UI[lang];
 document.documentElement.lang=lang;
 document.title = k==='frisco' ? 'Frisco & Midway Guide' : 'Frisco & Midway Guide';
 document.getElementById('app').innerHTML=`
  <header class="hero">
   <div class="eyebrow">${esc(g.eyebrow[lang])}</div>
   <h1>${esc(g.title[lang])}</h1>
   <p>${esc(g.intro[lang])}</p>
   <div class="note">${u.note}</div>
  </header>
  <div class="facts">${g.facts.map(f=>`<div class="fact"><b>${esc(f.b)}</b><span>${esc(f[lang])}</span></div>`).join('')}</div>
  <section class="season winter"><div class="season-head"><h2>${u.winter}</h2><span>${u.wsub}</span></div><ol class="picks">${g.winter.map(pickHTML).join('')}</ol></section>
  <section class="season summer"><div class="season-head"><h2>${u.summer}</h2><span>${u.ssub}</span></div><ol class="picks">${g.summer.map(pickHTML).join('')}</ol></section>
  <section class="season"><div class="season-head"><h2>${u.eat}</h2><span>${u.eatsub}</span></div><ul class="eat" id="eat">${g.eat.map(([n,d,q])=>`<li><b>${esc(n)}</b><span>${esc(d[lang])}</span><a href="${gmaps(q||n)}" target="_blank" rel="noopener">${UI[lang].dir} ↗</a></li>`).join('')}</ul></section>`;
 document.getElementById('f-note').textContent=u.foot;
 document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
 ['frisco','midway'].forEach(t=>{const a=document.getElementById('t-'+t); if(t===k)a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');});
}
document.querySelector('[aria-label="Language"]').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return; lang=b.dataset.lang; try{localStorage.setItem('mth-lang',lang);}catch(err){} render();});
window.addEventListener('hashchange',()=>{render(); window.scrollTo(0,0);});
render();
</script>
